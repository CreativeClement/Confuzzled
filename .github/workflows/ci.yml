name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Confuzzled
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke
        run: |
          PORT=3000 npm start &
          pid=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke
          kill $pid
